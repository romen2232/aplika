# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name api.aplika.test aplika.test;
    return 301 https://$host$request_uri;
}

# API - HTTPS
server {
    listen 443 ssl;
    server_name api.aplika.test;

    ssl_certificate /etc/nginx/certs/_wildcard.aplika.test.pem;
    ssl_certificate_key /etc/nginx/certs/_wildcard.aplika.test-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /app/public;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass api:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Return 404 for any other PHP file: only the front controller may run.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log /dev/stderr;
    access_log /dev/stdout;
}

# Frontend - HTTPS
server {
    listen 443 ssl;
    server_name aplika.test;

    ssl_certificate /etc/nginx/certs/_wildcard.aplika.test.pem;
    ssl_certificate_key /etc/nginx/certs/_wildcard.aplika.test-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_log /dev/stderr;
    access_log /dev/stdout;
}
