; Aplika API — local development PHP overrides.
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
date.timezone = UTC

; Keep the development loop fast; enable OPcache in production images only.
opcache.enable = 0
opcache.enable_cli = 0

; Xdebug — controlled at runtime via XDEBUG_MODE and XDEBUG_CONFIG env vars.
; Default: XDEBUG_MODE=off (no overhead). Set to "debug" to enable step debugging.
[xdebug]
xdebug.mode = ${XDEBUG_MODE}
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log_level = 0
