# SDD Configuration — Joblog
schema: spec-driven

context: |
  Tech stack: PHP 8.4 / Symfony 8 / Doctrine / PostgreSQL 16 / Next.js 16 / React 19 / TypeScript 5
  Architecture: DDD, CQRS, Screaming Architecture, Dependency Inversion
  Testing: PHPSpec (domain), Behat (acceptance), Vitest (frontend unit), Playwright (E2E)
  Style: Conventional commits, Docker Compose for all local commands
  Modules: Auth, Job, Application, Candidate, Company, Interview, Shared

rules:
  proposal:
    - Include rollback plan for risky changes
    - Consider impact on existing domain modules
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Domain specs must be framework-free
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Follow Screaming Architecture — modules organized by business capability
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Each TDD task: RED → GREEN → REFACTOR as separate commits
  apply:
    - Follow existing code patterns
    - Domain layer must not depend on Symfony or Doctrine
    - Use Docker Compose for all local commands
    tdd: true
    test_command: "docker compose exec api vendor/bin/phpspec run"
  verify:
    test_command: "docker compose exec api vendor/bin/phpspec run && docker compose exec api vendor/bin/behat && docker compose exec frontend npm run test"
    build_command: "docker compose exec frontend npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
