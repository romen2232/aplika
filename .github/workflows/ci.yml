# =============================================================================
# CI — Quality Checks & Test Suites
# =============================================================================
#
# Runs on every merge into staging or main:
#
#   quality:  PHPStan + PHP-CS-Fixer (backend)
#             ESLint + Prettier (frontend)
#   test:     Backend:  PhpSpec (domain/unit) → Behat (acceptance)
#             Frontend: Vitest (unit)         → Playwright (e2e)
#
# Both jobs run in parallel. The quality job is lightweight — no database
# needed — while the test job boots the full Docker Compose stack.
#
# ENVIRONMENT
# -----------
# The workflow reproduces the project's Docker Compose environment so checks
# run in the same conditions as local development. The only CI-specific
# adjustment is APP_UID / APP_GID, which are overridden to match the GitHub
# Actions runner user (uid 1001) so that bind-mounted files remain writable
# inside the containers without permission juggling.
#
# SECRETS / ENV VARS
# ------------------
# No secrets are required. All database credentials use the committed defaults
# from the root .env file (POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD).
# =============================================================================

name: CI

on:
  push:
    branches:
      - staging
      - main

# Cancel in-flight runs when a new push hits the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub Actions Ubuntu runners use uid/gid 1001 for the `runner` user.
  # Overriding these ensures bind-mounted project files are writable inside
  # the containers (the Dockerfiles remap www-data / node to these ids).
  APP_UID: "1001"
  APP_GID: "1001"

jobs:
  # ===========================================================================
  # Quality — static analysis and code style (no database required)
  # ===========================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      # --- Backend quality ---------------------------------------------------
      - name: Start API service
        run: docker compose up -d api

      - name: Install backend dependencies
        run: docker compose exec -T api composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: docker compose exec -T api vendor/bin/phpstan analyse --no-progress

      - name: Run PHP-CS-Fixer
        run: docker compose exec -T api vendor/bin/php-cs-fixer check --diff --allow-risky=yes

      # --- Frontend quality --------------------------------------------------
      - name: Install frontend dependencies
        run: docker compose run --rm --no-deps -T frontend npm install

      - name: Run ESLint
        run: docker compose run --rm --no-deps -T frontend npm run lint

      - name: Run Prettier
        run: docker compose run --rm --no-deps -T frontend npm run format:check

      # --- Cleanup -----------------------------------------------------------
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  # ===========================================================================
  # Tests — full test harness (requires database)
  # ===========================================================================
  test:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------
      # Checkout
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Build & start infrastructure
      # -------------------------------------------------------------------
      - name: Build Docker images
        run: docker compose build

      - name: Start database
        run: docker compose up -d database

      - name: Wait for database to accept connections
        run: |
          timeout 60 bash -c '
            until docker compose exec -T database \
              pg_isready -U aplika -d aplika >/dev/null 2>&1
            do
              sleep 2
            done
          '

      - name: Start API service
        run: docker compose up -d api

      # -------------------------------------------------------------------
      # Backend — install dependencies
      # -------------------------------------------------------------------
      - name: Install backend dependencies
        run: docker compose exec -T api composer install --no-interaction --prefer-dist

      # -------------------------------------------------------------------
      # Backend — database setup
      # Create the database schema and load fixtures. The fixtures feature
      # loads reference data and takes a snapshot for scenario isolation.
      # -------------------------------------------------------------------
      - name: Set up database
        run: |
          docker compose exec -T api php bin/console doctrine:database:drop --if-exists --force --no-interaction
          docker compose exec -T api php bin/console doctrine:database:create --no-interaction
          docker compose exec -T api php bin/console doctrine:migrations:migrate --no-interaction
          docker compose exec -T api rm -f var/snapshot.dump
          docker compose exec -T api vendor/bin/behat --tags=fixtures

      # -------------------------------------------------------------------
      # Frontend — install dependencies
      # -------------------------------------------------------------------
      # We use `docker compose run --rm --no-deps` because the frontend
      # service's default command is `npm run dev`, which would crash without
      # node_modules.  This one-shot container installs deps into the
      # bind-mounted directory and exits; the files persist on the host.
      - name: Install frontend dependencies
        run: docker compose run --rm --no-deps -T frontend npm install

      # -------------------------------------------------------------------
      # Start frontend & wait for the dev server
      # -------------------------------------------------------------------
      - name: Start frontend and web services
        run: docker compose up -d frontend

      - name: Wait for frontend dev server
        run: timeout 120 bash -c 'until curl -sf http://localhost:3000 >/dev/null 2>&1; do sleep 3; done'

      # -------------------------------------------------------------------
      # Playwright — install browsers (requires root for system deps)
      # Browsers are installed to a shared location (/ms-playwright) so both
      # root (installation) and the node user (test execution) can access them.
      # -------------------------------------------------------------------
      - name: Install Playwright browsers
        run: |
          docker compose exec -T -u root frontend sh -c 'mkdir -p /ms-playwright && chown node:node /ms-playwright'
          docker compose exec -T -u root frontend env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright npx playwright install --with-deps chromium

      # ===================================================================
      # TEST SUITES
      # Each suite runs in its own step so a failure is immediately
      # identifiable in the GitHub Actions UI.
      # ===================================================================

      # -------------------------------------------------------------------
      # Backend: PhpSpec — domain and unit specifications
      # -------------------------------------------------------------------
      - name: Run PhpSpec
        run: docker compose exec -T api vendor/bin/phpspec run --format=pretty

      # -------------------------------------------------------------------
      # Backend: Behat — acceptance tests
      # The FriendsOfBehat/SymfonyExtension boots the kernel in the `test`
      # environment; DATABASE_URL is provided by the compose service config.
      # The @fixtures tag is excluded because fixtures are loaded separately
      # during database setup (make db), not during test runs.
      # -------------------------------------------------------------------
      - name: Run Behat
        run: docker compose exec -T api vendor/bin/behat --tags='~@fixtures' --format=pretty

      # -------------------------------------------------------------------
      # Frontend: Vitest — unit tests (jsdom)
      # -------------------------------------------------------------------
      - name: Run Vitest
        run: docker compose exec -T frontend npm run test

      # -------------------------------------------------------------------
      # Frontend: Playwright — end-to-end tests
      # The dev server is already running on port 3000 inside the container;
      # Playwright connects to it via the default baseURL in playwright.config.ts.
      # -------------------------------------------------------------------
      - name: Run Playwright
        run: docker compose exec -T frontend env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright npm run test:e2e

      # -------------------------------------------------------------------
      # Cleanup — always runs, even if a test step above fails.
      # -------------------------------------------------------------------
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
