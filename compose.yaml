name: joblog

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-joblog}
      POSTGRES_USER: ${POSTGRES_USER:-joblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-joblog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-joblog} -d ${POSTGRES_DB:-joblog}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./docker/api
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_HOME: /tmp/composer
      DATABASE_URL: "postgresql://${POSTGRES_USER:-joblog}:${POSTGRES_PASSWORD:-joblog}@database:5432/${POSTGRES_DB:-joblog}?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./docker/api
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /app
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
    environment:
      HOME: /tmp
      DATABASE_URL: "postgresql://${POSTGRES_USER:-joblog}:${POSTGRES_PASSWORD:-joblog}@database:5432/${POSTGRES_DB:-joblog}?serverVersion=16&charset=utf8"
    volumes:
      - ./api:/app
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-80}:80"
    volumes:
      - ./api:/app:ro
      - ./docker/web/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  frontend:
    build:
      context: ./docker/frontend
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /app
    command: npm run ${FRONTEND_SCRIPT:-dev}
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://${API_DOMAIN:-api.joblog.dev}"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      - "${FRONTEND_DEBUG_PORT:-9229}:9229"
    volumes:
      - ./frontend:/app
    depends_on:
      - web

  locust:
    image: locustio/locust:latest
    profiles:
      - load-test
    ports:
      - "${LOCUST_PORT:-8089}:8089"
    volumes:
      - ./api/locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host=http://web:80
    depends_on:
      - web
    environment:
      - LOCUST_MODE_MASTER=false

volumes:
  database_data:
  redis_data:
