name: joblog

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-joblog}
      POSTGRES_USER: ${POSTGRES_USER:-joblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-joblog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-joblog} -d ${POSTGRES_DB:-joblog}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./docker/api
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_HOME: /tmp/composer
      DATABASE_URL: "postgresql://${POSTGRES_USER:-joblog}:${POSTGRES_PASSWORD:-joblog}@database:5432/${POSTGRES_DB:-joblog}?serverVersion=16&charset=utf8"
    volumes:
      - ./api:/app
    depends_on:
      database:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-80}:80"
    volumes:
      - ./api:/app:ro
      - ./docker/web/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  frontend:
    build:
      context: ./docker/frontend
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /app
    command: npm run dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://${API_DOMAIN:-api.joblog.dev}"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - web

volumes:
  database_data:
