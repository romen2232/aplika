# PHPSpec drives domain behaviour and isolated backend logic.
#
# Specs mirror the source path relative to the `App` namespace root:
#   src/Job/Domain/Job.php  ->  spec/Job/Domain/JobSpec.php
suites:
    aplika:
        namespace: App
        psr4_prefix: App
        src_path: src
        spec_path: .
        spec_namespace: spec\App
