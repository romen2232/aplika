services:
    App\Tests\Behat\BehatState:
        public: true

    App\Tests\Behat\DatabaseSnapshot:
        public: true
        arguments:
            $snapshotPath: '%kernel.project_dir%/var/snapshot.dump'
            $databaseUrl: '%env(DATABASE_URL)%'

    App\Tests\Behat\Auth\AuthContext:
        public: true
        arguments:
            $state: '@App\Tests\Behat\BehatState'
        tags:
            - { name: fob.context_service }

    App\Tests\Behat\FeatureContext:
        public: true
        arguments:
            $kernel: '@kernel'
            $state: '@App\Tests\Behat\BehatState'
        tags:
            - { name: fob.context_service }

    App\Tests\Behat\FixtureContext:
        public: true
        arguments:
            $state: '@App\Tests\Behat\BehatState'
            $snapshot: '@App\Tests\Behat\DatabaseSnapshot'
            $kernel: '@kernel'
        tags:
            - { name: fob.context_service }

    App\Tests\Behat\AsyncContext:
        public: true
        arguments:
            $asyncTransport: '@messenger.transport.async'
        tags:
            - { name: fob.context_service }
